name: Scrape Telegram

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scripts/scrape-telegram.mjs

      - name: Enrich new posts (AI-SEO)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/enrich-seo.mjs

      - name: Send LinkedIn drafts to Telegram
        continue-on-error: true
        env:
          LOVINGBI_TG_BOT_TOKEN: ${{ secrets.LOVINGBI_TG_BOT_TOKEN }}
          LOVINGBI_TG_CHAT_ID: ${{ secrets.LOVINGBI_TG_CHAT_ID }}
        run: node scripts/notify-linkedin.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/telegram-posts.json public/tg-images/
          git diff --cached --quiet || git commit -m "chore: update telegram posts"
          git push
