name: Scrape Telegram

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Переписать JSON, даже если постов нет (обновить просмотры/реакции)'
        type: boolean
        default: false
      skill_post:
        description: 'Перепроверить пост на новое для скилла (id), игнорируя отметку skillCheckedAt'
        type: string
        default: ''
      skill_notify:
        description: 'Слать Лере ссылку на PR скилла (выключить для тестовых прогонов)'
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        # По понедельникам (и по кнопке с force) JSON переписывается целиком — так раз в неделю
        # обновляются просмотры/реакции; в остальные дни коммит только при новых/изменённых постах.
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.force }}" = "true" ]; then export SCRAPE_FORCE=1; echo "weekly refresh: SCRAPE_FORCE=1"; fi
          node scripts/scrape-telegram.mjs

      - name: Enrich new posts (AI-SEO)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/enrich-seo.mjs

      - name: Propose skill updates (PR per post)
        # Новый пост → Claude сверяет его со скиллом → есть новое — ветка skill/post-<id> + PR + ссылка Лере.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOVINGBI_TG_BOT_TOKEN: ${{ inputs.skill_notify != false && secrets.LOVINGBI_TG_BOT_TOKEN || '' }}
          LOVINGBI_TG_CHAT_ID: ${{ secrets.LOVINGBI_TG_CHAT_ID }}
          SKILL_POST: ${{ inputs.skill_post }}
        run: |
          if [ -n "$SKILL_POST" ]; then node scripts/propose-skill-update.mjs --id "$SKILL_POST" --force
          else node scripts/propose-skill-update.mjs; fi

      - name: Send LinkedIn drafts to Telegram
        continue-on-error: true
        env:
          LOVINGBI_TG_BOT_TOKEN: ${{ secrets.LOVINGBI_TG_BOT_TOKEN }}
          LOVINGBI_TG_CHAT_ID: ${{ secrets.LOVINGBI_TG_CHAT_ID }}
        run: node scripts/notify-linkedin.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/telegram-posts.json public/tg-images/
          git diff --cached --quiet || git commit -m "chore: update telegram posts"
          git push
